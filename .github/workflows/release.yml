name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attest assets without publishing a GitHub Release.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout immutable ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate publish ref
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release publishing requires a tag ref; current ref is ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run security:audit
      - run: pnpm run build:plugin

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/release
          mkdir -p dist/release
          cp main.js dist/release/main.js
          cp styles.css dist/release/styles.css
          cp manifest.json dist/release/manifest.json
          test -s dist/release/main.js
          test -s dist/release/styles.css
          test -s dist/release/manifest.json

      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: |
            dist/release/main.js
            dist/release/manifest.json
            dist/release/styles.css

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vaultman-release-${{ github.run_id }}
          path: dist/release/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s RELEASE_NOTES.md
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/release/main.js dist/release/manifest.json dist/release/styles.css --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md "${release_flags[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/release/main.js dist/release/manifest.json dist/release/styles.css --verify-tag --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md "${release_flags[@]}"
          fi
