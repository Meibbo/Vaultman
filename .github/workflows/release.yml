name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attest assets without publishing a GitHub Release.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout immutable ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate publish ref
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release publishing requires a tag ref; current ref is ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Run verification gate
        run: vp run verify

      - name: Run dependency security audit
        run: vp run security:audit

      - name: Build plugin assets
        run: vp run build:plugin

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp dist/vite/main.js dist/release/main.js
          cp dist/vite/styles.css dist/release/styles.css
          cp manifest.json dist/release/manifest.json
          test -s dist/release/main.js
          test -s dist/release/styles.css
          test -s dist/release/manifest.json

      - name: Generate SBOM
        run: vp run sbom:release

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum main.js manifest.json styles.css sbom.cdx.json > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb
        with:
          subject-path: |
            dist/release/main.js
            dist/release/manifest.json
            dist/release/styles.css
            dist/release/SHA256SUMS
          sbom-path: dist/release/sbom.cdx.json

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vaultman-release-${{ github.run_id }}
          path: dist/release/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF
          Vaultman release assets generated by GitHub Actions from ${GITHUB_SHA}.

          Included assets:
          - main.js
          - manifest.json
          - styles.css
          - SHA256SUMS
          - sbom.cdx.json

          Verify provenance with:
          gh attestation verify main.js -R ${GITHUB_REPOSITORY}
          EOF
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/release/main.js \
              dist/release/manifest.json \
              dist/release/styles.css \
              dist/release/SHA256SUMS \
              dist/release/sbom.cdx.json \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Vaultman ${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/release/main.js \
              dist/release/manifest.json \
              dist/release/styles.css \
              dist/release/SHA256SUMS \
              dist/release/sbom.cdx.json \
              --verify-tag \
              --title "Vaultman ${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}"
          fi
