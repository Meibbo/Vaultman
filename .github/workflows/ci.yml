name: CI

on:
  push:
    branches: [main, sandbox, hardening, hardening-tests, hardening-audit, hardening-refactor]
  pull_request:
    branches: [main, sandbox, hardening]

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard-ai-files:
    name: Guard main against AI workflow files
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Detect AI workflow files
        id: ai
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          token: ${{ github.token }}
          list-files: shell
          filters: |
            ai:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.agents/**'
              - '.claude/**'

      - name: Fail if AI workflow files target main
        if: steps.ai.outputs.ai == 'true'
        env:
          AI_FILES: ${{ steps.ai.outputs.ai_files }}
        shell: bash
        run: |
          echo "::error::PRs to main must not include AI workflow files."
          printf 'Blocked files:\n%s\n' "${AI_FILES}"
          exit 1

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - name: Run dependency security audit
        run: vp run security:audit
      - run: vp run lint
      - run: vp run check
      - run: vp run build
      - name: Run unit tests with coverage
        run: vp run test:cover
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage/
