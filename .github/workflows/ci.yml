name: CI

on:
  push:
    branches: [main, dev, sandbox, hardening]
  pull_request:
    branches: [main, dev, sandbox, hardening]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard-ai-files:
    name: Guard main against AI workflow files
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Detect AI workflow files
        id: ai
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          token: ${{ github.token }}
          list-files: shell
          filters: |
            ai:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.agents/**'
              - '.claude/**'

      - name: Fail if AI workflow files target main
        if: steps.ai.outputs.ai == 'true'
        env:
          AI_FILES: ${{ steps.ai.outputs.ai_files }}
        shell: bash
        run: |
          echo "::error::PRs to main must not include AI workflow files."
          printf 'Blocked files:\n%s\n' "${AI_FILES}"
          exit 1

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run security:audit
